image: astral/uv:python3.14-trixie
stages:
    lint
    test
    security
    package
    deploy
    secret-detection


tests:
    before_script: uv sync
    stage: test
    script: uv run pytest

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
