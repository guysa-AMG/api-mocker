[project]
name = "api-mocker"
version = "0.1.0"
description = "Ephemeral Staging API & Mock Server"
readme = "README.md"
authors = [
    { name = "gumumjhb025", email = "gumumjhb025@student.wethinkcode.co.za" },
    {name = "guysa-AMG", email = "guysa010@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pylint>=4.0.8",
]

[project.scripts]
api-mocker = "api_mocker:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
